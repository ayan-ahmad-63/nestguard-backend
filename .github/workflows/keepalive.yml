name: Keep-alive
# Render's free plan sleeps after ~15 min idle, and Atlas free clusters pause when unused.
# This pings the live API (including a database ping) every 5 minutes.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping API + database
        run: curl -fsS --retry 5 --retry-delay 15 --retry-all-errors --max-time 60 "https://nestguard-backend-7ngl.onrender.com/api/v1/health-check?deep=1"
